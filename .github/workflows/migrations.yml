name: Database Migrations Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: dataops123
          POSTGRES_DB: labdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dataops -d labdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: dataops
          DB_NAME: labdb
          PGPASSWORD: dataops123
        run: |
          chmod +x scripts/run_migrations.sh
          scripts/run_migrations.sh

      - name: Verify schema version
        env:
          PGPASSWORD: dataops123
        run: psql -h localhost -p 5432 -U dataops -d labdb -c "SELECT * FROM infra.schema_version ORDER BY version;"
